name: Verify Release Artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  issues: write
  contents: read

jobs:

  verify-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch storefront.json from gh-pages
        run: |
          curl -sSfL -o storefront.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/gh-pages/storefront.json"

      - name: Verify all release artifacts are accessible
        id: verify
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const storefront = JSON.parse(fs.readFileSync('storefront.json', 'utf-8'));
            const allPaks = [
              ...(storefront.paks || []).map(p => ({ ...p, experimental: false })),
              ...(storefront.experimental_paks || []).map(p => ({ ...p, experimental: true }))
            ].filter(p => !p.disabled);

            console.log(`Checking ${allPaks.length} paks...`);

            const check = async (url) => {
              const resp = await fetch(url, {
                method: 'HEAD',
                redirect: 'follow',
                signal: AbortSignal.timeout(15000)
              });
              return resp.status;
            };

            const transient = (r) => r.error || r.status === 429 || r.status >= 500;

            const verify = async (pak) => {
              const url = `${pak.repo_url}/releases/download/${pak.version}/${pak.release_filename}`;
              let result;
              for (let attempt = 0; attempt < 3; attempt++) {
                if (attempt > 0) {
                  await new Promise(resolve => setTimeout(resolve, 5000 * attempt));
                }
                try {
                  result = { pak, url, status: await check(url) };
                } catch (err) {
                  result = { pak, url, error: err.message };
                }
                if (!transient(result)) {
                  break;
                }
              }
              return result;
            };

            const failures = [];
            const passed = [];

            const batchSize = 10;
            for (let i = 0; i < allPaks.length; i += batchSize) {
              const batch = allPaks.slice(i, i + batchSize);
              const results = await Promise.all(batch.map(verify));

              for (const r of results) {
                const label = r.pak.experimental ? ' [experimental]' : '';
                if (r.error || r.status !== 200) {
                  const reason = r.error || `HTTP ${r.status}`;
                  console.log(`FAIL  ${r.pak.storefront_name} (${r.pak.version})${label}: ${reason}`);
                  failures.push(r);
                } else {
                  console.log(`PASS  ${r.pak.storefront_name} (${r.pak.version})${label}`);
                  passed.push(r);
                }
              }
            }

            console.log(`\nPassed: ${passed.length}  Failed: ${failures.length}`);

            core.setOutput('total', allPaks.length);
            core.setOutput('passed', passed.length);
            core.setOutput('failed', failures.length);
            core.setOutput('failures_json', JSON.stringify(failures));

      - name: Create or update issue
        uses: actions/github-script@v9
        env:
          TOTAL: ${{ steps.verify.outputs.total }}
          PASSED: ${{ steps.verify.outputs.passed }}
          FAILED: ${{ steps.verify.outputs.failed }}
          FAILURES_JSON: ${{ steps.verify.outputs.failures_json }}
        with:
          script: |
            const issueTitle = 'Broken Release Artifacts Detected';
            const issueLabel = 'release-verify';
            const total = parseInt(process.env.TOTAL);
            const passed = parseInt(process.env.PASSED);
            const failed = parseInt(process.env.FAILED);
            const failures = JSON.parse(process.env.FAILURES_JSON);

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: issueLabel,
              state: 'open',
              per_page: 1
            });

            const existingIssue = existingIssues.data[0];

            if (failed === 0) {
              console.log('All release artifacts are accessible!');
              if (existingIssue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: `All ${total} release artifacts are now accessible. Closing this issue.`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  state: 'closed'
                });
                console.log(`Closed issue #${existingIssue.number}`);
              }
              return;
            }

            const cell = (s) => String(s).replace(/\|/g, '\\|');

            const now = new Date().toISOString().split('T')[0];
            let body = `## Broken Release Artifacts

            The following paks have release artifacts that are not accessible. This usually means the version in \`pak.json\` does not match any GitHub release tag, or the release asset is missing.

            **Last checked:** ${now}

            **Total paks:** ${total} | **Passed:** ${passed} | **Failed:** ${failed}

            ### Failures

            | Pak | Version | Error | Owner | Repository |
            |-----|---------|-------|-------|------------|
            `;

            for (const f of failures) {
              const reason = f.error || `HTTP ${f.status}`;
              const tag = f.pak.experimental ? ' (experimental)' : '';
              const repoLink = `[Link](${f.pak.repo_url})`;
              const owner = f.pak.repo_url.replace('https://github.com/', '').split('/')[0];
              body += `| ${cell(f.pak.storefront_name)}${tag} | \`${cell(f.pak.version)}\` | ${cell(reason)} | @${owner} | ${repoLink} |\n`;
            }

            body += `
            ### What to do

            For each failing pak, the developer needs to either:
            1. **Create a GitHub release** with a tag matching the \`version\` in their \`pak.json\` and upload the release asset matching \`release_filename\`
            2. **Update \`pak.json\`** so the \`version\` field matches an existing release tag

            ---
            *This issue is automatically managed by the [Verify Release Artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/verify_releases.yml) workflow.*
            `;

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`Updated issue #${existingIssue.number}`);
            } else {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: issueLabel
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: issueLabel,
                  color: 'e11d48',
                  description: 'Automated release artifact verification'
                });
              }

              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: body,
                labels: [issueLabel]
              });
              console.log(`Created issue #${newIssue.data.number}`);
            }
